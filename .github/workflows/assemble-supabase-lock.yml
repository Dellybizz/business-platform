name: Match exact Supabase lockfile

on:
  push:
    branches:
      - supabase-auth-stage
    paths:
      - .github/workflows/assemble-supabase-lock.yml

permissions:
  contents: write

jobs:
  lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: supabase-auth-stage
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
      - name: Try npm lockfile generators
        shell: bash
        run: |
          set -u
          EXPECTED="921218c0b1a2bc3f281aabd3e29b0e71bb82b548"
          BASE="687d9dd4f9c4124d9c88c2848eb845f633b58cbe"
          VERSIONS="10.6.0 10.7.0 10.8.2 10.8.3 10.9.0 10.9.1 10.9.2 11.0.0 11.1.0 11.2.0 11.3.0 11.4.2 11.5.2 11.6.2 11.15.0 11.16.0"
          for VERSION in $VERSIONS; do
            npm install -g "npm@$VERSION" >/dev/null 2>&1 || continue
            for MODE in baseline fresh; do
              if [ "$MODE" = baseline ]; then
                git show "$BASE:package-lock.json" > package-lock.json
              else
                rm -f package-lock.json
              fi
              npm install --package-lock-only --ignore-scripts --no-audit --no-fund >/dev/null 2>&1 || continue
              ACTUAL="$(git hash-object package-lock.json)"
              echo "npm=$VERSION mode=$MODE hash=$ACTUAL"
              if [ "$ACTUAL" = "$EXPECTED" ]; then
                echo "MATCH npm=$VERSION mode=$MODE"
                rm .github/workflows/assemble-supabase-lock.yml
                git config user.name "github-actions[bot]"
                git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                git add package-lock.json .github/workflows/assemble-supabase-lock.yml
                git commit -m "Restore Supabase auth exact lockfile"
                git push origin HEAD:supabase-auth-stage
                exit 0
              fi
            done
          done
          echo "No exact npm-generated match"
          exit 1
