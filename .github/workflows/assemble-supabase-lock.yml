name: Inspect generated Supabase lockfile

on:
  push:
    branches:
      - supabase-auth-stage
    paths:
      - package.json
      - .github/workflows/assemble-supabase-lock.yml

permissions:
  contents: write

jobs:
  lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: supabase-auth-stage
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
          cache: npm
      - run: npm install -g npm@10.9.2
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - run: echo "generated=$(git hash-object package-lock.json)"
      - name: Commit generated lockfile on staging only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Stage generated Supabase lockfile" || exit 0
          git push origin HEAD:supabase-auth-stage
